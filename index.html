<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Primary SEO -->
    <title>Archive Terminal — Star Wars Character Explorer</title>
    <meta name="description"
      content="Search, filter, and sort every character in the Star Wars universe. A fast, accessible character explorer built with React, TypeScript, and the Star Wars API." />
    <meta name="keywords"
      content="Star Wars, Star Wars API, SWAPI, character explorer, Star Wars characters, React app, Star Wars database" />
    <meta name="author" content="Archive Terminal" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://tumhara-vercel-url.vercel.app/" />
    
    <!-- Open Graph (Facebook, LinkedIn, WhatsApp, Slack, ...) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Archive Terminal" />
    <meta property="og:title" content="Archive Terminal — Star Wars Character Explorer" />
    <meta property="og:description" content="Search, filter, and sort every character in the Star Wars universe." />
    <meta property="og:image" content="https://tumhara-vercel-url.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://tumhara-vercel-url.vercel.app/" />
    
    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Archive Terminal — Star Wars Character Explorer" />
    <meta name="twitter:description" content="Search, filter, and sort every character in the Star Wars universe." />
    <meta name="twitter:image" content="https://tumhara-vercel-url.vercel.app/og-image.png" />
    
    <meta name="theme-color" content="#0B0E14" />
    <meta
      name="description"
      content="Archive Terminal — a searchable record of individuals catalogued by the Star Wars universe API."
    />
    <meta name="color-scheme" content="dark light" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Archive Terminal — Star Wars Character Explorer</title>
    <script>
      // Apply persisted theme before paint to avoid a flash of the wrong theme.
      try {
        var t = localStorage.getItem('archive-terminal:theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
        } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
